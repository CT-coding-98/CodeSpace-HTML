<h1 class="display-4 text-center">Create an account</h1>
<br>
<h6 class="text-center"> By making an account, you can keep informed about new products, tutorials and save your checkout information for faster purchases.</h6>
<br>
<form class="row">
    <div class="col-md-6 mb-3">
        <label for="firstName" class="form-label">First Name</label>
        <input type="text" class="form-control" id="firstName" placeholder="First Name" required>
    </div>
    <div class="col-md-6 mb-3">
        <label for="lastName" class="form-label">Last Name</label>
        <input type="text" class="form-control" id="lastName" placeholder="Last Name" required>
    </div>
    <div class="col-md-6 mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="Email" required>
    </div>
    <div class="col-md-6 mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Password" required>
    </div>
    <div class="col-12">
        <button type="submit" class="btn btn-primary">Register</button>
        <a href="login.html" class="btn btn-warning">Already have an account? Log in</a>
    </div>
</form>
